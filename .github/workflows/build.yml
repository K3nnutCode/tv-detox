name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: git ls-files '*.sh' | xargs shellcheck --severity=warning

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > release.jks; fi
      - name: Build
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' && 'release.jks' || 'key.jks' }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS || 'tvhome123' }}
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: out/tvhome.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tvhome-apk
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Android TV emulator (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: sh ci/smoke-test.sh emulator-5554 smoke-api${{ matrix.api }}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-api${{ matrix.api }}
          path: smoke-api*.png

  photos-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Build standalone Home Photos
        run: sh build-photos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: home-photos-apk
          path: out-photos/home-photos.apk

  photos-preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Build isolated UI preview
        run: HOME_PHOTOS_PREVIEW=1 sh build-photos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: home-photos-preview-apk
          path: out-photos-preview/home-photos-preview.apk

  photos-emulator-test:
    needs: [build, photos-build, photos-preview-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tvhome-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: home-photos-apk
          path: out-photos
      - uses: actions/download-artifact@v4
        with:
          name: home-photos-preview-apk
          path: out-photos-preview
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Home Photos on Android TV 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: |
            sh ci/photos-smoke-test.sh emulator-5554
            sh ci/photos-preview-smoke-test.sh emulator-5554

  photos-stable-ci-test:
    # Validate the future permanent package with a disposable CI key. Never publish this APK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Verify permanent builds reject a missing release key
        run: |
          if HOME_PHOTOS_STABLE=1 sh build-photos.sh; then
            echo "SECURITY FAILURE: permanent build accepted an absent signing key" >&2
            exit 1
          fi
      - name: Compile stable-package APK with a disposable test-only key
        run: |
          set -eu
          KEY_FILE="$RUNNER_TEMP/stable-test-only.jks"
          keytool -genkeypair -keystore "$KEY_FILE" -storepass "test-only-password" -keypass "test-only-password" \
            -alias homephotosstable -keyalg RSA -keysize 3072 -validity 365 \
            -dname "CN=Home Photos CI Test" >/dev/null 2>&1
          HOME_PHOTOS_STABLE=1 HOME_PHOTOS_KEYSTORE="$KEY_FILE" \
            HOME_PHOTOS_KEYSTORE_PASS="test-only-password" sh build-photos.sh
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify out-photos-stable/home-photos-stable.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging out-photos-stable/home-photos-stable.apk |
            grep -F "package: name='com.ansub.tvhome.photos.stable'"
          rm -f "$KEY_FILE"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [shellcheck, build, emulator-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tvhome-apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" tvhome.apk --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "Install with: sh install.sh <TV_IP>"
