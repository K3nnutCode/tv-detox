name: Hybrid TV v1.0 Stable — test and persistent-key release

on:
  push:
    branches:
      - feature/hybrid-tv-stable-v1
    paths:
      - 'AndroidManifest-hybrid-stable.xml'
      - 'AndroidManifest-hybrid-youtube-preview.xml'
      - 'AndroidManifest-hybrid-glass-preview.xml'
      - 'build-hybrid-stable.sh'
      - '.github/workflows/hybrid-stable.yml'
      - 'src/com/ansub/tvhome/**'
      - 'apps-photos.txt'
  pull_request:
    paths:
      - 'AndroidManifest-hybrid-stable.xml'
      - 'AndroidManifest-hybrid-youtube-preview.xml'
      - 'AndroidManifest-hybrid-glass-preview.xml'
      - 'build-hybrid-stable.sh'
      - '.github/workflows/hybrid-stable.yml'
      - 'src/com/ansub/tvhome/**'
      - 'apps-photos.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke:
    name: Check v1 source and build throwaway-key emulator APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Verify original official Brunei-Muara timetable offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stable-prayer-tests
          javac -d /tmp/stable-prayer-tests src/com/ansub/tvhome/PrayerSchedule2026.java tests/com/ansub/tvhome/PrayerSchedule2026Test.java
          java -cp /tmp/stable-prayer-tests com.ansub.tvhome.PrayerSchedule2026Test
      - name: Build disposable-key smoke APK (NOT for installation on the TCL)
        env:
          MODE: smoke
        run: sh build-hybrid-stable.sh
      - name: Verify HOME candidate, fallback safety, APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK=out-hybrid-stable/hybrid-tv-v1-smoke-NOT-RELEASE.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ansub.tvhome.hybrid.stable'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/hybrid-stable-manifest.txt
          grep -q 'android.intent.category.HOME' /tmp/hybrid-stable-manifest.txt
          grep -q 'android.intent.category.DEFAULT' /tmp/hybrid-stable-manifest.txt
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' /tmp/hybrid-stable-manifest.txt
          ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' /tmp/hybrid-stable-manifest.txt
          ! grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' /tmp/hybrid-stable-manifest.txt
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' /tmp/hybrid-stable-manifest.txt
          echo 'PASS: opt-in HOME candidate; distinct app ID; Home Photos unchanged'
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-tv-v1-smoke-not-release
          path: out-hybrid-stable/hybrid-tv-v1-smoke-NOT-RELEASE.apk
          retention-days: 3

  android-tv-11-smoke-test:
    name: Verify Android TV 11 launch and remote navigation
    needs: build-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hybrid-tv-v1-smoke-not-release
          path: out-hybrid-stable
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install manually, test D-pad, and verify HOME button is still handled by Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: |
            adb install out-hybrid-stable/hybrid-tv-v1-smoke-NOT-RELEASE.apk
            adb shell am start -W -n com.ansub.tvhome.hybrid.stable/com.ansub.tvhome.HybridActivity
            adb shell pm path com.ansub.tvhome.hybrid.stable | grep -q base.apk
            adb shell dumpsys window | grep mCurrentFocus | grep -q com.ansub.tvhome.hybrid.stable
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb shell uiautomator dump /sdcard/v1-focus.xml >/dev/null
            adb shell cat /sdcard/v1-focus.xml | grep -oE 'content-desc="Hybrid dock: [^"]*"[^>]*focused="true"' > focus-down.txt
            test -s focus-down.txt
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            adb shell uiautomator dump /sdcard/v1-focus.xml >/dev/null
            adb shell cat /sdcard/v1-focus.xml | grep -oE 'content-desc="Hybrid dock: [^"]*"[^>]*focused="true"' > focus-right.txt
            test -s focus-right.txt
            ! cmp -s focus-down.txt focus-right.txt
            adb shell input keyevent KEYCODE_DPAD_LEFT
            adb shell uiautomator dump /sdcard/v1-focus.xml >/dev/null
            adb shell cat /sdcard/v1-focus.xml | grep -oE 'content-desc="Hybrid dock: [^"]*"[^>]*focused="true"' > focus-left.txt
            cmp -s focus-down.txt focus-left.txt
            adb shell input keyevent KEYCODE_DPAD_UP
            adb shell uiautomator dump /sdcard/v1-focus.xml >/dev/null
            if adb shell cat /sdcard/v1-focus.xml | grep -qE 'content-desc="Hybrid dock: [^"]*"[^>]*focused="true"'; then exit 1; fi
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb exec-out screencap -p > hybrid-tv-v1-emulator.png
            # Android TV emulator registers the selected default but its
            # privileged Google TV launcher can remain the foreground HOME UI.
            # Assert the preference/role target, not OEM visual routing.
            # TCL HOME routing is a separate required real-device gate.
            adb shell cmd package set-home-activity com.ansub.tvhome.hybrid.stable/com.ansub.tvhome.HybridActivity | grep -F 'Success'
            adb shell cmd shortcut get-default-launcher | grep -F 'com.ansub.tvhome.hybrid.stable/com.ansub.tvhome.HybridActivity'
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell dumpsys window | grep mCurrentFocus || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-tv-v1-emulator-screenshot
          path: hybrid-tv-v1-emulator.png

  build-youtube-preview:
    name: Build separately installable v1.0.1 YouTube preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Verify personal-photo wallpaper is not replaced by media artwork
        shell: bash
        run: |
          set -euo pipefail
          SRC=src/com/ansub/tvhome/HybridActivity.java
          grep -Fq 'photo = new TvWallpaperView(this)' "$SRC"
          grep -Fq 'SLIDE_MS = 60000L' "$SRC"
          grep -Fq 'heroArtwork.setImageBitmap(' "$SRC"
          if grep -Eq 'cinematic\.(setImageBitmap|setVisibility|setImageDrawable)' "$SRC"; then
            echo 'FAIL: video thumbnail must not replace the photo wallpaper' >&2
            exit 1
          fi
          # Regression guard: sample loop must rediscover new YouTube sessions.
          LISTENER=src/com/ansub/tvhome/HybridSessionListener.java
          grep -Fq 'refreshActiveSessions();' "$LISTENER"
          grep -Fq 'attach(sessions.getActiveSessions(component));' "$LISTENER"
          grep -Fq 'SAMPLE_INTERVAL_MS = 15000L' "$LISTENER"
          # The preview must recover an owner-authorized service after TCL reboot.
          grep -Fq 'liveConnection = true;' "$LISTENER"
          grep -Fq 'liveConnection = false;' "$LISTENER"
          grep -Fq 'requestMediaListenerRebindIfNeeded();' "$SRC"
          grep -Fq 'NotificationListenerService.requestRebind(component);' "$SRC"
          # TCL Settings button is Linux scan code 233 from BT_RC813_MA;
          # it is NOT Android keycode 233 (an unrelated TV key).
          grep -Fq 'event.getScanCode() == 233' "$SRC"
          grep -Fq '"BT_RC813_MA".equals(remoteName)' "$SRC"
          grep -Fq 'Log.i("HybridTclKeys"' "$SRC"
      - name: Build isolated preview using disposable signing key
        env:
          MODE: preview
        run: sh build-hybrid-stable.sh
      - name: Verify preview package, signature and preserved stable identity
        shell: bash
        run: |
          set -euo pipefail
          APK=out-hybrid-stable/hybrid-tv-v1.0.1-youtube-preview.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" |
            grep -F "package: name='com.ansub.tvhome.hybrid.youtube.preview'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/hybrid-youtube-preview-manifest.txt
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' /tmp/hybrid-youtube-preview-manifest.txt
          ! grep -q 'android.intent.category.HOME' /tmp/hybrid-youtube-preview-manifest.txt
          echo 'PASS: preview is separately installed and never competes for HOME'
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-tv-v1.0.1-youtube-preview-apk
          path: out-hybrid-stable/hybrid-tv-v1.0.1-youtube-preview.apk
          retention-days: 14

  glass-preview:
    name: Build isolated Hybrid TV Glass v1.1 APK
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Verify Glass design and functional regressions
        shell: bash
        run: |
          set -euo pipefail
          SRC=src/com/ansub/tvhome/HybridActivity.java
          grep -Fq 'photo = new TvWallpaperView(this)' "$SRC"
          grep -Fq 'SLIDE_MS = 60000L' "$SRC"
          grep -Fq 'showTvInputSelector' "$SRC"
          grep -Fq 'getScanCode() == 233' "$SRC"
          grep -Fq 'new HybridWeatherWidget(this, scale, true)' "$SRC"
          grep -Fq 'heroArtwork.setImageBitmap(' "$SRC"
          grep -Fq 'View ribbon = new View(this)' "$SRC"
          grep -Fq 'showIdle(); // Utility navigation stays quiet' "$SRC"
          # Android 11 wallpaper texture prewarm before first draw, off UI thread.
          grep -Fq 'result.prepareToDraw();' "$SRC"
          grep -Fq 'blurred.prepareToDraw();' "$SRC"
          # Real photo fades must continue when TCL Animator duration scale = 0.
          WALL=src/com/ansub/tvhome/TvWallpaperView.java
          grep -Fq 'next.view.postOnAnimation(pendingFade);' "$WALL"
          grep -Fq 'Photo crossfade complete:' "$WALL"
          ! grep -Fq 'next.view.animate().alpha(1f)' "$WALL"
          if grep -q 'cinematic.setImageBitmap' "$SRC"; then
            echo 'Fullscreen artwork overlay regression' >&2
            exit 1
          fi
      - name: Build Glass with disposable signing certificate
        env:
          MODE: glass
        run: sh build-hybrid-stable.sh
      - name: Verify separate package, TV app entry and NO Home takeover
        shell: bash
        run: |
          set -euo pipefail
          APK=out-hybrid-stable/hybrid-tv-glass-v1.1-preview.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ansub.tvhome.hybrid.glass.preview'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/hybrid-glass-manifest.txt
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' /tmp/hybrid-glass-manifest.txt
          ! grep -q 'android.intent.category.HOME' /tmp/hybrid-glass-manifest.txt
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' /tmp/hybrid-glass-manifest.txt
          echo 'PASS: visually distinct preview cannot replace Stable Home'
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-tv-glass-v1.1-preview-apk
          path: out-hybrid-stable/hybrid-tv-glass-v1.1-preview.apk
          retention-days: 14

  release-signed:
    name: Stable APK — same owner-held signing key on every update
    needs: [build-smoke, android-tv-11-smoke-test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Build release signed using OWNER'S persistent keystore secrets
        env:
          MODE: release
          HYBRID_RELEASE_KEYSTORE_B64: ${{ secrets.HYBRID_RELEASE_KEYSTORE_B64 }}
          HYBRID_RELEASE_KEYSTORE_PASS: ${{ secrets.HYBRID_RELEASE_KEYSTORE_PASS }}
          HYBRID_RELEASE_KEY_ALIAS: ${{ secrets.HYBRID_RELEASE_KEY_ALIAS }}
          HYBRID_RELEASE_KEY_PASS: ${{ secrets.HYBRID_RELEASE_KEY_PASS }}
        run: sh build-hybrid-stable.sh
      - name: Verify v1.0 package and print public certificate fingerprint for tracking
        shell: bash
        run: |
          set -euo pipefail
          APK=out-hybrid-stable/hybrid-tv-v1.0.0.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ansub.tvhome.hybrid.stable'"
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-tv-v1.0.0-persistently-signed
          path: out-hybrid-stable/hybrid-tv-v1.0.0.apk
          retention-days: 30
